<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter Tight";font-weight:400;src:url(fonts/inter-tight-latin-400-normal.woff2)}
@font-face{font-family:"Inter Tight";font-weight:500;src:url(fonts/inter-tight-latin-500-normal.woff2)}
@font-face{font-family:"Inter Tight";font-weight:600;src:url(fonts/inter-tight-latin-600-normal.woff2)}
@font-face{font-family:"Inter Tight";font-weight:700;src:url(fonts/inter-tight-latin-700-normal.woff2)}
@font-face{font-family:"Inter Tight";font-weight:800;src:url(fonts/inter-tight-latin-800-normal.woff2)}
@font-face{font-family:"JetBrains Mono";font-weight:500;src:url(fonts/jetbrains-mono-latin-500-normal.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Inter Tight",system-ui,sans-serif}
#cam,#back,#front,.fill{position:absolute;inset:0}
#cam{transform-origin:50% 40%;overflow:hidden}
#bg,#person{position:absolute;left:0;top:0;width:1080px;height:1920px;display:block}
#person{transform-origin:50% 100%}
#back,#front{overflow:hidden}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:overlay}
</style></head>
<body>
<div id="cam">
  <img id="bg" alt="">
  <div id="back"></div>
  <img id="person" alt="">
  <div id="front"></div>
</div>
<script src="stage.js"></script>
</body></html>
