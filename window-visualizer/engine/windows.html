  const ph = $("phone"), PW = Math.round(W * 0.66), PH = Math.round(PW * 2.06);
  ph.style.width = PW + "px"; ph.style.height = PH + "px"; ph.style.marginLeft = -PW / 2 + "px"; ph.style.marginTop = -PH / 2 + "px";
  ph.querySelector(".body").style.borderRadius = ph.querySelector(".shadow").style.borderRadius = Math.round(PW * 0.15) + "px";
  ph.style.transform = `translate3d(${W * 0.1 + zx * 1.4}px, ${H * 0.1 + zy * 1.4}px, 0) scale(${1.32 * z}) rotateX(${30 + sh(0.7, 3) * 1.5}deg) rotateZ(${-24 + rot * 2}deg)`;
  // the screen: same windows, same moment, small UI under it
  const S = $("screen"), m = PW * 0.045, SW = PW - 2 * m, SH = PH - 2 * m;
  if (S.width !== Math.round(SW * 1.5)) { S.width = Math.round(SW * 1.5); S.height = Math.round(SH * 1.5); }
  S.style.left = m + "px"; S.style.top = m + "px"; S.style.width = SW + "px"; S.style.height = SH + "px"; S.style.borderRadius = Math.round(PW * 0.11) + "px";
  const s = S.getContext("2d"), sw = S.width, shh = S.height;
  s.fillStyle = "#050505"; s.fillRect(0, 0, sw, shh);
  const L = layout(), k2 = (sw * 0.9) / (L.cols * L.px), gh = L.rows * L.py * k2;
  drawGrid(s, L, litAt(t, (P.phone && P.phone.gain) || 1.6), sw / 2 - (L.x0 + (L.cols * L.px - (L.px - L.tw)) / 2) * k2, shh * 0.1 - L.y0 * k2, k2);
  s.fillStyle = "rgba(255,255,255,.85)"; s.font = `600 ${sw * 0.04}px Inter`; s.textBaseline = "top"; s.fillText((P.phone && P.phone.time) || "9:41", sw * 0.1, sw * 0.045);
  const uy = shh * 0.1 + gh + sw * 0.05;
  s.fillStyle = "rgba(255,255,255,.18)"; s.fillRect(sw * 0.08, uy, sw * 0.84, 2);
  s.fillStyle = "rgba(255,255,255,.55)"; s.fillRect(sw * 0.08, uy, sw * 0.84 * Math.min(1, (t + ((P.music && P.music.start) || 0)) / ((P.phone && P.phone.length) || 200)), 2);
  s.fillStyle = "rgba(255,255,255,.42)"; s.font = `400 ${sw * 0.034}px "JetBrains Mono"`; s.textAlign = "center";
  const label = ((P.phone && P.phone.label) || "window visualizer   v.01").toUpperCase().split("").join(" ");
  s.fillText(label, sw / 2, uy + sw * 0.05); s.textAlign = "left";
}

// ---------- captions ----------
function capAt(t) { let c = null; for (const x of caps) if (x.at <= t + 1e-6) c = x; return c && c.text ? c : null; }
function setCap(c) {
  const el = $("cap");
  const html = c ? c.text.replace(/[&<>]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[m]).replace(/\*([^*]+)\*/g, '<span class="serif">$1</span>') : "";
  if (el.innerHTML !== html) el.innerHTML = html;
}
function insAt(t) { return inserts.find((x) => t >= x.start && t < x.end) || null; }

window.__load = async ({ plan, audio, base, tileFiles }) => {
  P = plan; A = audio; D = audio.duration;
  [W, H] = [1080, 1920];
  const st = $("stage"); st.style.width = W + "px"; st.style.height = H + "px";
  for (const id of ["grid", "table"]) { $(id).width = W; $(id).height = H; }
  const L = layout(), r = rngOf((plan.windows && plan.windows.seed) || 7);
  const occ = (plan.windows && plan.windows.lit) || 0.7, lo = (plan.react && plan.react.low) || 0.25, hi = (plan.react && plan.react.high) || 0.85;
  for (let rr = 0; rr < L.rows; rr++) for (let cc = 0; cc < L.cols; cc++) wins.push({ r: rr, c: cc, band: Math.floor(r() * 6), th: lo + (hi - lo) * r(), cap: r() < occ, tile: wins.length });
  const src = plan.windows && plan.windows.source && plan.windows.source !== "code" ? { dir: base + plan.windows.source.replace(/\/?$/, "/"), files: tileFiles } : null;
  await loadTiles(wins.length, src, ((plan.windows && plan.windows.seed) || 7) * 7919);
  const cs = plan.caption || {};
  const el = $("cap"); el.style.top = (cs.y || 0.4323) * H + "px"; el.style.fontSize = (cs.size || 0.0505) * W + "px";
  caps = (plan.captions || []).slice().sort((a, b) => a.at - b.at);
  inserts = (plan.inserts || []).map((x) => ({ ...x }));
  const clip = inserts.find((x) => x.type === "clip");
  if (clip) { clipVid = $("clip"); clipVid.src = base + clip.file; await new Promise((ok) => { clipVid.onloadeddata = ok; clipVid.onerror = ok; }); }
  await document.fonts.ready;
  for (const f of ["600 50px Inter", "italic 400 50px 'Instrument Serif'", "400 20px 'JetBrains Mono'"]) await document.fonts.load(f);
  const marks = [...new Set([0, ...caps.map((c) => c.at), ...inserts.flatMap((x) => [x.start, x.end])])].filter((x) => x < D).sort((a, b) => a - b);
  return { duration: D, scenes: marks.map((m, i) => ({ start: m, end: i + 1 < marks.length ? marks[i + 1] : D })) };
};

window.__seek = async (t) => {
  const ins = insAt(t), on = litAt(t);
  const g = $("grid").getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  drawGrid(g, layout(), on);
  $("ins").style.display = ins && ins.type === "phone" ? "block" : "none";
  if (ins && ins.type === "phone") drawInsert(t, ins);
  if (clipVid) {
    const show = ins && ins.type === "clip";
    clipVid.style.display = show ? "block" : "none";
    if (show) { const want = (ins.in || 0) + (t - ins.start); if (Math.abs(clipVid.currentTime - want) > 1e-3) { await new Promise((ok) => { clipVid.onseeked = ok; clipVid.currentTime = want; }); } }
  }
  setCap(ins && !ins.captions ? null : capAt(t));
};
</script>
